<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    path {
      /* WICHTIG: fill auf "none" setzen, sonst wird das Dreieck schwarz ausgefüllt */
      fill: none;
      stroke-width: 2.0;
      stroke-linejoin: round;
      stroke-linecap: round;

      /* Farbe für HELLE Hintergründe (Leuchtendes Rot-Orange) */
      stroke: #FF3366;
    }

    /* Automatische Anpassung an DUNKLE Hintergründe (Neon-Cyan) */
    @media (prefers-color-scheme: dark) {
      path {
        stroke: #00E5FF;
      }
    }
  </style>
  <path d="M12,2L1,21H23M12,6L19.53,19H4.47" />
</svg>
