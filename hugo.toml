baseURL = 'https://afterdarkblog.github.io/'
locale = 'de'
defaultContentLanguage = 'de'
title = 'After Dark'
theme = 'PaperModX'
# Hier definieren wir nun das komplett eigene, zentrierte Copyright inklusive Jahr am richtigen Platz:

# Code Highlight
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

disqusShortname = "yourDisqusShortname"

[params]
	#defaultTheme = "auto" # "light", "dark", oder "auto" (PaperModX Standard)
	#ShowThemeToggle = true
	disableThemeToggle = false
	useCDN = false
	subtitle = "Mein neues PaperModX Blog"
	mathjax = false
	katex = false
	#custom_css = ["css/custom.css"]
	showSocialButtons = true
  # Dies deaktiviert das automatische Standard-Copyright des Themes
  hideCopyright = true
  # Wir definieren beide Schreibweisen direkt unter [params],
  # damit das Theme den Wert garantiert findet:
  ShowReadingTime = true
  showReadingTime = true

[params.page]
  # Wir definieren beide Schreibweisen direkt unter [params],
  # damit das Theme den Wert garantiert findet:
  ShowReadingTime = true
  showReadingTime = true

[params.assets]
  disableFingerprinting = true

# --- HIER DEN PROFILE MODE EINFÜGEN ---
[params.profileMode]
  enabled = true
  title = "After Dark"
  subtitle = "Über das Gute, Wahre und Schöne. Willkommen auf meinem Blog."
  imageUrl = "images/avatar.png" # Optional: Pfad zu Ihrem Profilbild (in static/images/)
  imageWidth = 120               # Breite des Bildes
  imageHeight = 120              # Höhe des Bildes
  imageTitle = "Matthias Fuchs"

  # Hier können Sie Buttons hinzufügen, die unter dem Text erscheinen
  [[params.profileMode.buttons]]
    name = "Zum Blog"
    url = "/posts/"

  [[params.profileMode.buttons]]
    name = "Über mich"
    url = "/about/"

[outputFormats]
  [outputFormats.JSON]
    baseName = "index"
    isPlainText = true
    mediaType = "application/json"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[pagination]
  pagerSize = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Social Icons (Umgestellt auf PaperModX Syntax)
[[params.socialIcons]]
name = "GitHub"
url = "https://github.com"

[[params.socialIcons]]
name = "Twitter"
url = "https://twitter.com"

[[params.socialIcons]]
name = "GitLab"
url = "https://gitlab.com"

# Main menu Items
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4

[[menu.main]]
name = "Archiv"
url = "/archives/"
weight = 10

[[menu.main]]
name = "Suche"
url = "/search/"
weight = 20
