baseURL = 'https://afterdarkblog.github.io/'
languageCode = 'de'
title = 'After Dark'
theme = 'PaperModX'
copyright = "(c) Copyright Matthias Fuchs. This work is licensed under a [Creative Commons Attribution-ShareAlike 4.0 International](https://creativecommons.org) - for all the articles and mutlimedia. Code blogs are licensed under [GNU General Public License Version 3 or later](https://gnu.org)."

# Code Highlight
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

disqusShortname = "yourDisqusShortname"

[outputFormats]
  [outputFormats.JSON]
    baseName = "index"
    isPlainText = true
    mediaType = "application/json"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[pagination]
  pagerSize = 3

[params]
	defaultTheme = "auto" # "light", "dark", oder "auto" (PaperModX Standard)
	useCDN = false
	subtitle = "Mein neues PaperModX Blog"
	mathjax = false
	katex = false
	custom_css = ["css/custom.css"]
	# Zwingt die Suche, die index.json an der absoluten Basis der Domain abzurufen:
  searchJsonUrl = "/index.json"

# Suchkonfiguration für Fuse.js (Behebt den Suchfehler)
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

[markup.goldmark.renderer]
unsafe = true

# Social Icons (Umgestellt auf PaperModX Syntax)
[[params.socialIcons]]
name = "GitHub"
url = "https://github.com"

[[params.socialIcons]]
name = "Twitter"
url = "https://twitter.com"

[[params.socialIcons]]
name = "GitLab"
url = "https://gitlab.com"

# Main menu Items
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4

[[menu.main]]
name = "Archiv"
url = "/archives/"
weight = 10

[[menu.main]]
name = "Suche"
url = "/search/"
weight = 20
