baseURL = 'https://afterdarkblog.github.io/'
locale = 'de'
title = 'After Dark'
theme = 'PaperModX'
copyright = "(c) Copyright Matthias Fuchs. This work is licensed under a [Creative Commons Attribution-ShareAlike 4.0 International](https://creativecommons.org) - for all the articles and mutlimedia. Code blogs are licensed under [GNU General Public License Version 3 or later](https://gnu.org)."

# Code Highlight
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

disqusShortname = "yourDisqusShortname"

[outputFormats]
  [outputFormats.JSON]
    baseName = "index"
    isPlainText = true
    mediaType = "application/json"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[pagination]
  pagerSize = 3

[params]
	defaultTheme = "auto" # "light", "dark", oder "auto" (PaperModX Standard)
	useCDN = false
	subtitle = "Mein neues PaperModX Blog"
	mathjax = false
	katex = false
	custom_css = ["css/custom.css"]
	showSocialButtons = true

# --- HIER DEN PROFILE MODE EINFÜGEN ---
[params.profileMode]
  enabled = true
  title = "After Dark"
  subtitle = "Über das Gute, Wahre und Schöne. Willkommen auf meinem Blog."
  imageUrl = "images/avatar.png" # Optional: Pfad zu Ihrem Profilbild (in static/images/)
  imageWidth = 120               # Breite des Bildes
  imageHeight = 120              # Höhe des Bildes
  imageTitle = "Matthias Fuchs"

  # Hier können Sie Buttons hinzufügen, die unter dem Text erscheinen
  [[params.profileMode.buttons]]
    name = "Zum Blog"
    url = "/posts/"

  [[params.profileMode.buttons]]
    name = "Über mich"
    url = "/about/"

[markup.goldmark.renderer]
unsafe = true

# Social Icons (Umgestellt auf PaperModX Syntax)
[[params.socialIcons]]
name = "GitHub"
url = "https://github.com"

[[params.socialIcons]]
name = "Twitter"
url = "https://twitter.com"

[[params.socialIcons]]
name = "GitLab"
url = "https://gitlab.com"

# Main menu Items
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4

[[menu.main]]
name = "Archiv"
url = "/archives/"
weight = 10

[[menu.main]]
name = "Suche"
url = "/search/"
weight = 20
